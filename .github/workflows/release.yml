# Baut eine App aus ihrem privaten Quell-Repo (Spiegel von git.brudilabs.com), signiert sie und veröffentlicht
# sie hier als Release. Danach wird der Katalog (bzw. für den Launcher latest.json) aktualisiert.
# Für content-core und market-core entsteht zusätzlich der Server (Docker-Image + Deploy-Dateien), den
# deploy/install.sh auf dem VPS installiert; „nur Server“ überspringt die Client-Builds und den Katalog.
# Name des Servers: <app ohne -core>-server (content-server, market-server).
name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [financial-core, content-core, market-core, core-launcher]
      tag:
        description: Git-Tag im Quell-Repo, z. B. v0.2.0
        required: true
      notizen:
        description: Neuigkeiten (erscheinen im Launcher)
        required: false
        default: ""
      nur_server:
        description: Nur den Server bauen (content-core, market-core; ohne Client und Katalog)
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP: ${{ inputs.app }}
  TAG: ${{ inputs.tag }}

jobs:
  build:
    if: ${{ !inputs.nur_server }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            plattform: linux-x86_64
          - os: macos-14
            plattform: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Der Quellcode liegt privat auf git.brudilabs.com und wird beim Push nach brudilabs/<app> (privat) gespiegelt.
      - name: Tag prüfen
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Ungültiger Tag: $TAG"; exit 1; }'

      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: brudilabs/${{ inputs.app }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.QUELLCODE_TOKEN }}
          path: src
          persist-credentials: false

      - name: Version prüfen
        run: |
          version=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$TAG" ] || { echo "Cargo-Version $version passt nicht zu $TAG"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Bauen
        run: |
          npm ci --prefix src/ui
          cd src/app
          if [ "$RUNNER_OS" = Linux ]; then
            ../ui/node_modules/.bin/tauri build --bundles appimage
          else
            bundles=app; [ "$APP" = core-launcher ] && bundles=app,dmg
            ../ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles "$bundles"
          fi

      # Signiert wird für alle Apps gleich (die Apps selbst haben keine Updater-Konfiguration):
      # Linux das AppImage, macOS ein tar.gz des .app-Bündels – beides im Format des Tauri-Updaters.
      - name: Einsammeln und signieren
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir dist
          name="${APP}_${VERSION}_${{ matrix.plattform }}"
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(ls src/target/release/bundle/appimage/*.AppImage | head -1)" "dist/$name.AppImage"
            datei="dist/$name.AppImage"
          else
            b=src/target/universal-apple-darwin/release/bundle
            buendel=$(cd $b/macos && ls -d *.app | head -1)
            COPYFILE_DISABLE=1 tar -czf "dist/$name.app.tar.gz" -C "$b/macos" "$buendel"
            datei="dist/$name.app.tar.gz"
            if ls $b/dmg/*.dmg >/dev/null 2>&1; then cp "$(ls $b/dmg/*.dmg | head -1)" "dist/$name.dmg"; fi
          fi
          src/ui/node_modules/.bin/tauri signer sign "$datei"
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.plattform }}
          path: dist/

  # Server von content-core und market-core: dasselbe Image wie deploy/Dockerfile.server, als Datei für docker load.
  server:
    if: inputs.app == 'content-core' || inputs.app == 'market-core'
    runs-on: ubuntu-24.04
    steps:
      - name: Tag prüfen
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Ungültiger Tag: $TAG"; exit 1; }'

      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: brudilabs/${{ inputs.app }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.QUELLCODE_TOKEN }}
          path: src
          persist-credentials: false

      - name: Version prüfen
        run: |
          version=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$TAG" ] || { echo "Cargo-Version $version passt nicht zu $TAG"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SERVER=${APP%-core}-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          # Sonst lädt die Action einen Build-Bericht als Artefakt (*.dockerbuild) hoch, an dem
          # download-artifact in „veroeffentlichen“ scheitert.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: src
          file: src/deploy/Dockerfile.server
          platforms: linux/amd64
          tags: ${{ env.SERVER }}:${{ env.VERSION }}
          load: true
          cache-from: type=gha,scope=${{ env.SERVER }}
          cache-to: type=gha,scope=${{ env.SERVER }},mode=max

      - name: Packen
        run: |
          mkdir dist
          name="${APP}-server_${VERSION}"
          docker save "$SERVER:$VERSION" | gzip -9 > "dist/${name}_linux-x86_64.image.tar.gz"
          # Alles aus deploy/ außer dem Dockerfile (content-core: Compose, caddy/, Skripte; market-core
          # zusätzlich ki-schluessel.sh und env.beispiel).
          tar -czf "dist/${name}_deploy.tar.gz" -C src/deploy --exclude=Dockerfile.server .
          (cd dist && sha256sum "${name}_linux-x86_64.image.tar.gz" "${name}_deploy.tar.gz" > "${name}_SHA256SUMS")
          cp src/deploy/install.sh dist/install.sh
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server
          path: dist/

  veroeffentlichen:
    needs: [build, server]
    # build oder server dürfen übersprungen sein (nur Server bzw. andere App), aber nicht fehlschlagen.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Eingaben prüfen
        if: inputs.nur_server && inputs.app != 'content-core' && inputs.app != 'market-core'
        run: echo 'Nur Server gibt es nur für content-core und market-core' && exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: brudilabs/${{ inputs.app }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.QUELLCODE_TOKEN }}
          path: src
          persist-credentials: false

      - name: Quellpaket (AGPL)
        run: |
          version=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git -C src archive --format=tar.gz --prefix="$APP-$version/" -o "../dist/${APP}_${version}_quellcode.tar.gz" HEAD

      - name: Release anlegen
        env:
          NOTIZEN: ${{ inputs.notizen }}
        run: |
          # install.sh liegt fest unter dem Release content-server bzw. market-server (unten), nicht je Version.
          mapfile -t dateien < <(find dist -maxdepth 1 -type f ! -name '*.sig' ! -name install.sh | sort)
          # Gibt es den Release schon (z. B. „nur Server“ nachgereicht), kommen die Dateien dazu.
          if gh release view "$APP-$TAG" >/dev/null 2>&1; then
            gh release upload "$APP-$TAG" "${dateien[@]}" --clobber
          else
            gh release create "$APP-$TAG" --title "$APP $VERSION" --notes "${NOTIZEN:-$APP $VERSION}" "${dateien[@]}"
          fi

      # Feste Adressen für den Server: install.sh zur Erstinstallation, version.txt für „neueste Version“.
      - name: Server-Zeiger (content-server, market-server)
        if: inputs.app == 'content-core' || inputs.app == 'market-core'
        run: |
          server="${APP%-core}-server"
          titel=$([ "$APP" = market-core ] && echo marketCore || echo contentCore)
          gh release view "$server" >/dev/null 2>&1 || gh release create "$server" --title "$titel-Server" \
            --notes "Aktuelle Version des $titel-Servers. Installation: siehe install.sh"
          # Nur vorwärts und ohne Vorabversionen: version.txt ist das, was „Aktualisieren“ im Client anbietet.
          bisher=$(gh release download "$server" -p version.txt -O - 2>/dev/null || true)
          neueste=$(printf '%s\n%s\n' "$bisher" "$TAG" | grep -v -e '^$' -e '-' | sort -V | tail -n 1)
          if [ "$neueste" = "$TAG" ]; then
            echo "$TAG" > version.txt
            gh release upload "$server" dist/install.sh version.txt --clobber
          else
            echo "version.txt bleibt bei $bisher"
          fi

      - name: Katalog aktualisieren
        if: inputs.app != 'core-launcher' && !inputs.nur_server
        env:
          NOTIZEN: ${{ inputs.notizen }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          gh release view katalog >/dev/null 2>&1 || gh release create katalog --title Katalog --notes "App-Katalog für den brudilabs Launcher"
          gh release download katalog -p catalog.json -D . || true
          basis="https://github.com/${{ github.repository }}/releases/download/$APP-$TAG"
          python3 scripts/katalog.py katalog --katalog catalog.json --app "apps/$APP.json" --version "$VERSION" \
            --basis-url "$basis" --notizen "$NOTIZEN" \
            linux-x86_64="dist/${APP}_${VERSION}_linux-x86_64.AppImage" \
            darwin-universal="dist/${APP}_${VERSION}_darwin-universal.app.tar.gz"
          npx --yes @tauri-apps/cli@2 signer sign catalog.json
          gh release upload katalog catalog.json catalog.json.sig --clobber

      - name: Launcher-Update (latest.json)
        if: inputs.app == 'core-launcher'
        env:
          NOTIZEN: ${{ inputs.notizen }}
        run: |
          basis="https://github.com/${{ github.repository }}/releases/download/$APP-$TAG"
          python3 scripts/katalog.py launcher --version "$VERSION" --basis-url "$basis" --notizen "$NOTIZEN" \
            linux-x86_64="dist/${APP}_${VERSION}_linux-x86_64.AppImage" \
            darwin-universal="dist/${APP}_${VERSION}_darwin-universal.app.tar.gz" > latest.json
          # Feste Download-Adressen für die Erstinstallation
          cp "dist/${APP}_${VERSION}_linux-x86_64.AppImage" core-launcher.AppImage
          cp "dist/${APP}_${VERSION}_darwin-universal.dmg" core-launcher.dmg
          gh release view launcher >/dev/null 2>&1 || gh release create launcher --title "brudilabs Launcher" --notes "Aktuelle Version des Launchers"
          gh release upload launcher latest.json core-launcher.AppImage core-launcher.dmg --clobber
